<title>Defesa FitoVision</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: caderno de ensaio. Barra fixa com abas e relógio; coluna única de leitura; a fala em serifa, o resto em sans. */
:root{
  --bg:#f4f6f1; --surface:#ffffff; --ink:#1d2a22; --muted:#5d6b62; --line:#d9dfd6;
  --green:#1f5130; --leaf:#5b9a2c; --leaf-soft:#e3f1d6; --warn:#b4560a; --warn-soft:#fbe9d7;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --read:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121814; --surface:#1b231d; --ink:#e7ede8; --muted:#9aa89f; --line:#2e3a31;
  --green:#9fd08a; --leaf:#8cc763; --leaf-soft:#243422; --warn:#f0a35c; --warn-soft:#3a2a1a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121814; --surface:#1b231d; --ink:#e7ede8; --muted:#9aa89f; --line:#2e3a31;
  --green:#9fd08a; --leaf:#8cc763; --leaf-soft:#243422; --warn:#f0a35c; --warn-soft:#3a2a1a; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px}
.brand{font-weight:700;color:var(--green);letter-spacing:-.01em;margin-right:auto}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav a{padding:6px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
nav a[aria-current="page"]{background:var(--green);color:var(--surface)}
nav a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
main{padding-block:24px 64px;display:flex;flex-direction:column;gap:20px}
h1{font-size:26px;line-height:1.2;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:18px;margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
.lead{color:var(--muted);max-width:65ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
button{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer}
button.pri{background:var(--green);border-color:var(--green);color:var(--surface)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tag{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
/* relógio */
.clock{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.clock .big{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.clock .meta{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0}
.track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--leaf);width:0}
.late{color:var(--warn)}
/* slides */
.slide{scroll-margin-top:140px}
.slide.now{border-color:var(--leaf);box-shadow:0 0 0 2px var(--leaf-soft)}
.slide header{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.slide .n{font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}
.slide .t{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.msg{background:var(--leaf-soft);border-radius:8px;padding:8px 12px;font-weight:600;color:var(--green)}
.fala{font-family:var(--read);font-size:18px;line-height:1.6;max-width:65ch}
.trans{color:var(--muted);font-style:italic}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600;color:var(--muted)}
details p{margin-top:6px;max-width:70ch}
/* números */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.flash{text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px;padding:14px 16px;border-radius:12px}
.flash b.v{font-size:24px;letter-spacing:-.01em;color:var(--green);font-variant-numeric:tabular-nums;line-height:1.15}
.flash span{font-weight:400;color:var(--ink);font-size:14px}
.flash.hid span{color:transparent;background:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 12px);border-radius:6px;user-select:none}
/* perguntas */
.q h2{font-family:var(--read);font-weight:600;font-size:19px}
.q .a{max-width:68ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border-radius:999px;padding:5px 12px;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--green);color:var(--surface);border-color:var(--green)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.scroll{overflow-x:auto}
code{font-size:.9em;background:var(--leaf-soft);padding:1px 5px;border-radius:4px}
@media (max-width:520px){.clock .big{font-size:32px}.fala{font-size:17px}}
@media (prefers-reduced-motion:no-preference){.track i{transition:width .4s linear}}

<script>
const D = {"slides": [{"titulo": "Capa", "secao": "", "tempo": 30, "pagina": "", "mensagem": "Quem sou, o que é o trabalho e a pergunta em uma frase.", "fala": "Boa tarde a todos. Meu nome é José Pedro, e este é o meu Trabalho de Conclusão de Curso em Engenharia de Software, orientado pelo professor Leanderson André. O título é “Detecção de anomalias fitossanitárias em hortaliças utilizando visão computacional e aprendizado de máquina”. Em uma frase: eu quis saber se um modelo que acerta 99% no computador continua acertando na horta.", "transicao": "Começo pelo problema.", "se_perguntarem": ""}, {"titulo": "99% no papel, 70% a 85% no campo", "secao": "Introdução", "tempo": 75, "pagina": "p. 1", "mensagem": "Existe uma distância entre o resultado de laboratório e o de campo, e ela tem custo para o produtor.", "fala": "Diagnosticar doença de planta por foto é uma das aplicações mais estudadas de aprendizado profundo na agricultura. O artigo que abriu a área, em 2016, passou de 99% de acurácia. Só que aquelas fotos são de estúdio: folha isolada, fundo liso, luz controlada. Quando os mesmos modelos vão para a lavoura, com solo, sombra e várias plantas no quadro, a literatura registra entre 70% e 85%. Essa diferença tem nome: domain gap. E isso importa no Brasil, porque 77% dos estabelecimentos rurais são de agricultura familiar, onde o diagnóstico ainda é feito no olho. Em hortaliças folhosas, como alface, rúcula e couve, o ciclo é curto, e uma semana de atraso já vira perda. O risco não é só o modelo errar. É errar com cara de certeza, porque aí o produtor confia.", "transicao": "A minha pergunta parte daí.", "se_perguntarem": "De onde vêm os números? Mais de 99%: Mohanty, Hughes e Salathé (2016), no PlantVillage. 70% a 85%: revisão de Shafay et al. (2025). 77%: Censo Agropecuário 2017 (IBGE, 2019)."}, {"titulo": "Questão de pesquisa e objetivo", "secao": "Introdução", "tempo": 75, "pagina": "p. 2", "mensagem": "Uma questão de pesquisa e um objetivo, avaliados em três situações cada vez mais longe do treino.", "fala": "A questão de pesquisa foi: em que medida um sistema de triagem fitossanitária para hortaliças folhosas, baseado em transfer learning, treinado com imagens públicas auditadas contra vazamento de dados e com calibração e abstenção, mantém desempenho confiável em fotografias de campo? O objetivo foi avaliar exatamente isso: em que medida esse sistema mantém desempenho confiável em fotografias de campo. Para responder, avaliei o sistema em três situações, cada uma mais distante das imagens de treino: um teste das mesmas fontes, uma fonte que o modelo nunca viu e fotos de horta. Em cada uma, olhei também se a abstenção pegava os erros. Já adianto: a resposta é parcial, e eu vou mostrar por quê.", "transicao": "Primeiro, o que é o sistema.", "se_perguntarem": "Objetivo geral e específicos eram do TCC-I; no TCC-II o trabalho tem uma questão e um objetivo, os mesmos no resumo, na introdução, na metodologia e na conclusão. Se pedirem o que foi feito: consolidar o dataset com deduplicação, comparar quatro arquiteturas, avaliar calibração e abstenção e montar o conjunto de campo, que ainda não tem folhas doentes."}, {"titulo": "O sistema: quatro respostas, não duas", "secao": "Procedimentos metodológicos", "tempo": 75, "pagina": "p. 3 e 4", "mensagem": "É uma triagem com quatro veredictos; dois deles existem para o sistema poder dizer “não sei”.", "fala": "O sistema recebe uma foto tirada com o celular e devolve uma de quatro respostas: saudável, anômalo, inconclusivo ou não é folha. As duas últimas existem porque uma rede binária sempre responde alguma coisa, até para a foto de uma parede. O “não é folha” vem de um índice de vegetação, o Excess Green: se menos de 10% dos pixels forem de vegetação, a foto é rejeitada antes de chegar à rede. O “inconclusivo” vem da abstenção: se a confiança calibrada ficar abaixo do limiar de 0,85, o sistema não dá diagnóstico. É uma triagem: ele diz se há algo errado com a folha, não qual é a doença. Esta tela é a interface que desenvolvi.", "transicao": "Agora, os dados e o método.", "se_perguntarem": "Por que binário? Porque as fontes públicas não têm as mesmas doenças nas mesmas culturas; a triagem é a tarefa que os dados sustentam. Por que 0,85? É o menor limiar que garante 98% de acurácia seletiva na validação."}, {"titulo": "Dados, modelos e avaliação", "secao": "Procedimentos metodológicos", "tempo": 75, "pagina": "p. 4 a 6", "mensagem": "175 mil imagens deduplicadas, quatro arquiteturas, estatística pareada e três níveis de avaliação.", "fala": "Os dados vêm de seis fontes públicas: 175 mil imagens, em duas classes. Para não repetir a mesma foto no treino e no teste, cada imagem vira um hash perceptual, as quase idênticas são agrupadas, e cada grupo vai inteiro para uma partição. Comparei quatro arquiteturas: três redes convolucionais, EfficientNet-B0, MobileNetV2 e ResNet-50, e um Vision Transformer, todas com transfer learning a partir do ImageNet. A métrica principal é a acurácia balanceada, com intervalo de confiança por bootstrap. Para comparar modelos, uso o teste de McNemar, porque todos são avaliados nas mesmas imagens. E a avaliação tem três níveis: o teste das mesmas fontes do treino, uma fonte nunca vista e fotos de campo, com o rótulo anotado antes de rodar o modelo.", "transicao": "O primeiro resultado é sobre o meu próprio trabalho.", "se_perguntarem": "Hash perceptual: resumo de 64 bits da imagem, invariante a rotação e espelhamento (grupo D4); distância de Hamming até 4 = mesma foto. Treino: AdamW, até 30 épocas, 224×224, semente 42. Partições da base: 120.861 / 25.944 / 23.967."}, {"titulo": "O 99,01% estava errado", "secao": "Resultados", "tempo": 105, "pagina": "p. 2 e 4", "mensagem": "57,35% do teste do TCC-I já estava no treino. O número foi descartado.", "fala": "No TCC-I eu cheguei a 99,01% de acurácia. Só que, em fotos novas, o sistema se comportava de forma errática. A pergunta que mudou o trabalho foi: por que esse número é bom demais? Fiz uma auditoria com hash perceptual e descobri que 57,35% do conjunto de teste eram fotos quase idênticas a fotos do treino: a mesma imagem recortada, girada ou comprimida. O modelo não estava generalizando; estava reconhecendo fotos que já tinha visto. Refiz a divisão agrupando as quase idênticas, e o vazamento caiu para 0,04%. O 99,01% foi descartado. Com o teste limpo, apareceram ainda dois defeitos que a métrica escondia: a abstenção nunca disparava, e quase 4 mil fotos de alface saudável estavam rotuladas como doentes, por causa do nome de uma pasta. Foram treze fotos de campo que denunciaram esse erro. Para mim, essa é a primeira lição do trabalho: desconfiar do número bom.", "transicao": "Com o teste limpo, começo pela primeira situação: o teste das mesmas fontes.", "se_perguntarem": "O dataset do TCC-I tinha 210.832 arquivos e só 106.403 fotografias distintas. O critério atual ainda não pega variantes muito alteradas: 23% do teste são variantes de fotos de alface com outra variante no treino (corrigido no ciclo 5: 1,7%)."}, {"titulo": "Arquiteturas · Empate no teste intra-fonte", "secao": "Resultados", "tempo": 90, "pagina": "p. 6", "mensagem": "EfficientNet-B0 e ViT-B/16 empataram; o ViT é 21 vezes maior e chegou ao mesmo lugar.", "fala": "Primeiro, as arquiteturas. No teste, com quase 24 mil imagens, o EfficientNet-B0 e o ViT empatam em 98,48% de acurácia balanceada, com intervalo de confiança de 98,32 a 98,64. O teste de McNemar dá p igual a 0,26: não há diferença entre os dois. E os dois superam o MobileNetV2 e o ResNet-50, com p menor que dez elevado a menos onze. O detalhe importante: o ViT tem 21 vezes mais parâmetros que o EfficientNet e é quase três vezes mais lento. Chega ao mesmo resultado. Então, neste estudo, o EfficientNet-B0 foi a opção mais adequada: o mesmo desempenho com muito menos custo. E, nos meus dados, a arquitetura não foi o gargalo.", "transicao": "Agora, a confiança: ela avisa quando o modelo erra?", "se_perguntarem": "McNemar olha só as imagens em que os dois modelos discordam: 158 que só o EfficientNet acerta, 180 que só o ViT acerta. Falsos negativos: EfficientNet 209, ViT 137. Há um treino por modelo (semente 42): o empate pode mudar com outras sementes."}, {"titulo": "Calibração · Calibrado na média, cego nos erros", "secao": "Resultados", "tempo": 90, "pagina": "p. 6", "mensagem": "A calibração funcionou, mas a abstenção interceptou só 31% e 15% dos erros.", "fala": "A confiança do modelo avisa quando ele erra? Redes profundas costumam ser confiantes demais. Para corrigir, usei temperature scaling, e funcionou: o erro de calibração, o ECE, ficou em 0,003 na validação. Ou seja, quando o modelo diz 90%, ele acerta perto de 90%. Mas calibrar na média não basta. O limiar de abstenção intercepta só 31% dos erros do EfficientNet e 15% dos erros do ViT. Mais de dois terços dos erros passam com confiança alta. E fora das fontes de treino piora: nos erros nas 13 fotos de campo, a confiança ficou entre 0,95 e 0,999, e o ECE subiu de 0,003 para 0,146, um valor só indicativo com 13 fotos. Ou seja: a confiança ficou bem calibrada onde o modelo foi treinado, mas, sozinha, a abstenção não protegeu o produtor onde mais importa.", "transicao": "E por que piora fora das fontes de treino? É o próximo slide.", "se_perguntarem": "Temperature scaling divide os logits por um escalar T ajustado na validação (T = 0,561 no EfficientNet). ECE: diferença média entre confiança e acerto, em 15 faixas. EfficientNet: 113 de 363 erros interceptados, abstenção em 1,2% das imagens. ViT: 51 de 341, 0,5%."}, {"titulo": "O teste por dentro e por fora", "secao": "Resultados", "tempo": 105, "pagina": "p. 6 e 7", "mensagem": "O 98,48% é uma média: 99,7% em estúdio, 86,3% em lavoura e 75,4% em uma fonte nunca vista.", "fala": "Este é o resultado central do trabalho. O 98,48% é uma média, e a média esconde coisa. Quando separo o teste pelo tipo de foto, as culturas fotografadas em estúdio têm 99,7%. As fotografadas em lavoura, que são mandioca, arroz, cana e café, têm 86,3% e concentram 81% dos erros. Isso dentro do mesmo teste. E fui além: testei o modelo em uma fonte que ele nunca tinha visto, um lote de espinafre-de-malabar. A acurácia foi de 75,4%, 23 pontos abaixo, e eram fotos de folha isolada em fundo claro, parecidas com as do treino. Quando coloquei esse lote no treino, subiu para 88,4%, mas aí ele deixa de ser fonte nova. O que isso mostra: um teste sem duplicatas continua sendo um teste da mesma distribuição. O número do teste diz como o modelo vai nas fontes que conhece, não no mundo.", "transicao": "Fui atrás da causa desse erro na lavoura.", "se_perguntarem": "Estúdio: N = 10.061; lavoura: N = 4.530 (295 dos 363 erros). Espinafre: N = 484, modelo do ciclo 3. É Basella alba (espinafre-de-malabar), não Spinacia oleracea. Não diga “laboratório” para o 98,48%: diga “intra-fonte”."}, {"titulo": "Corrigir o atalho tem custo", "secao": "Resultados", "tempo": 90, "pagina": "p. 7", "mensagem": "O ciclo 5 reduz falsos alarmes na lavoura e perde um pouco de sensibilidade: é outro ponto de operação.", "fala": "Uma auditoria mostrou de onde vinha parte desse erro: atalhos nos dados. A cultura estava associada ao rótulo, e variantes da mesma foto de alface apareciam dos dois lados da divisão. No quinto ciclo corrigi isso e treinei as quatro arquiteturas de novo. Na lavoura, as três redes convolucionais ganharam de 7 a 12 pontos de especificidade, ou seja, menos falsos alarmes. O custo veio na sensibilidade, que caiu de 2 a 5 pontos: um pouco mais de folhas doentes passando como sadias. O ViT quase não mudou. Então o ciclo 5 não é um modelo melhor em tudo; é outro ponto de operação. Qual dos dois usar depende do custo de cada erro para o produtor. E no lote de espinafre que nenhum modelo viu, os quatro ficam entre 86% e 90%: dez pontos abaixo das fontes de treino.", "transicao": "Falta a terceira situação: o campo.", "se_perguntarem": "Por imagem, na lavoura, o ciclo 4 acerta mais (p ≤ 0,04), porque três em cada quatro imagens ali são anômalas. Teste do ciclo 5: 18.413 imagens; 97,4% no EfficientNet, não comparável ao 98,48% (o teste é outro). ViT: p = 0,66."}, {"titulo": "Campo · O que foi possível medir", "secao": "Resultados", "tempo": 105, "pagina": "p. 6 e 7", "mensagem": "Fundo real não gerou falso alarme; a sensibilidade em campo ainda não foi medida.", "fala": "E no campo? Tenho dois conjuntos. O primeiro são 13 fotos de alface, do TCC-I. O EfficientNet do ciclo 4 acerta 11 de 13, ou 84,6%. Mas o intervalo de confiança vai de 58% a 96%. Com 13 fotos, nenhuma versão se distingue de outra; a amostra serviu para revelar defeitos, não para escolher modelo. O segundo conjunto é de 27 de outubro: 10 fotos de canteiros de alface, em horta, com fundo real, isto é, solo, mato e vários pés no quadro. As quatro versões classificaram as 10 como sadias, com confiança acima de 0,98, inclusive em recortes da imagem. Ou seja: o fundo real não provocou falso alarme. Só que a horta inteira estava sadia. Sem folhas doentes, não consegui medir a sensibilidade em campo nem o tamanho do domain gap. Por isso a resposta, nesta parte, é parcial.", "transicao": "Esse padrão aparece também em outros trabalhos.", "se_perguntarem": "Wilson para 10 de 10: 72,2% a 100%. Lote de casa (18/10): um pé colhido, fotografado em toalha branca; tudo saiu anômalo, inclusive 3 sadias. Não é campo, e folha e cena não se separam. Meta de coleta: 100 a 300 fotos (Wilson de 15,5 pontos com 100)."}, {"titulo": "O mesmo padrão em outras culturas", "secao": "Discussão", "tempo": 45, "pagina": "p. 3 e 7", "mensagem": "A queda fora da fonte é regra na literatura; a lacuna é reunir tudo isso em hortaliças folhosas.", "fala": "Esse padrão não é só meu. Em videira, a mesma EfficientNet-B0 faz 73,8% em um conjunto externo. Em amêndoa, o F1 cai de 0,98 para 0,56 quando as fontes são separadas. E um estudo deste ano, do PlantVillage para fotos de campo, mostra a queda de 99,7% para 32%, com o modelo ainda confiante. O que não encontrei foi um estudo que reúna, em hortaliças folhosas, auditoria de vazamento, calibração, abstenção e teste fora da fonte. É essa a lacuna que o trabalho ocupa.", "transicao": "Antes de concluir, as limitações.", "se_perguntarem": "Videira: Ergün et al. (2026). Amêndoa: Workneh et al. (2026). PlantVillage → PlantDoc: Xiang, Shi e Zhu (2026), ResNet-50, confiança média de 79,8% com 32% de acerto. Espinafre-de-malabar em partição interna: 97,3% (Kabya et al., 2026)."}, {"titulo": "Limitações do estudo", "secao": "Discussão", "tempo": 75, "pagina": "p. 7", "mensagem": "Cinco ressalvas, ditas por mim antes que a banca pergunte.", "fala": "Antes da conclusão, as limitações, ditas por mim. Primeira: a evidência de campo é pequena, 23 fotos, só de alface, e sem folhas doentes no lote com fundo real. Segunda: treino e teste vêm das mesmas fontes públicas, e parte das culturas entra só como aproximação visual das hortaliças. Terceira: a calibração foi ajustada fora do campo, e a literatura mostra que, nessa passagem, a confiança continua acima da acurácia. Quarta: a tarefa é binária; o sistema não diz qual é a doença, e sintomas parecidos podem ter causas diferentes. Quinta: cada modelo foi treinado uma vez só; com outra semente, o empate entre EfficientNet e ViT pode não se repetir. Nenhuma delas invalida os resultados, mas todas delimitam até onde eles valem.", "transicao": "Com isso, a conclusão.", "se_perguntarem": "Fontes: (ii) Xu et al. (2024); (iii) Xiang, Shi e Zhu (2026); (iv) Barbedo (2016); (v) Coakley e Gundersen (2026), 100 sementes por experimento em ResNet e ViT."}, {"titulo": "O que o trabalho responde", "secao": "Conclusão", "tempo": 90, "pagina": "p. 8", "mensagem": "O desempenho dependeu mais do protocolo de avaliação do que da arquitetura; a entrega é o protocolo.", "fala": "Voltando ao começo: modelos que passam de 99% em laboratório perdem desempenho no campo, e em hortaliças folhosas isso quase não tinha sido medido. O objetivo foi avaliar em que medida o meu sistema mantém desempenho confiável em fotografias de campo. Os resultados indicam que o desempenho dependeu mais do protocolo de avaliação do que da arquitetura: 98,48% nas fontes de treino, 75,4% em uma fonte nunca vista e 84,6% em 13 fotos de campo, com um intervalo largo. EfficientNet-B0 e ViT empataram, e o EfficientNet foi o mais adequado. A calibração funcionou no domínio de treino, mas a abstenção deixou passar mais de dois terços dos erros. No campo, nenhum falso alarme em horta sadia, e a sensibilidade ainda sem medida. Então a resposta à questão é parcial. A principal contribuição é o protocolo: auditoria de vazamento, avaliação em três situações e testes pareados, tudo reprodutível por script. Este trabalho não entrega um modelo pronto para o campo. Entrega a medida de quanto falta e o caminho para chegar lá.", "transicao": "Para fechar, os próximos passos.", "se_perguntarem": "Então o sistema não funciona? Funciona nas fontes em que foi treinado; fora delas, o trabalho mede a perda em vez de escondê-la. Um 99% retratado e um 75% medido valem mais do que um 99% sem auditoria."}, {"titulo": "Trabalhos futuros", "secao": "Conclusão", "tempo": 30, "pagina": "p. 8", "mensagem": "Cinco próximos passos, todos saídos das limitações.", "fala": "Como trabalhos futuros: completar a coleta com folhas doentes e outras culturas; recalibrar a confiança com fotos de campo; testar modelos de fundação congelados; repetir o treino com várias sementes; e definir, com os produtores, o custo de cada tipo de erro. Muito obrigado. Fico à disposição para as perguntas.", "transicao": "", "se_perguntarem": "Modelos de fundação: Nguyen et al. (2026) chegam a 51% com DINOv2 congelado, contra 26% a 30% do ajuste fino completo, do PlantVillage para o PlantDoc."}], "numeros": [{"n": "99,01%", "o": "Acurácia do TCC-I, retratada"}, {"n": "57,35%", "o": "Fração do teste antigo contaminada por vazamento"}, {"n": "0,04%", "o": "Vazamento residual no split atual"}, {"n": "98,48%", "o": "Acurácia balanceada intra-fonte, EfficientNet-B0 e ViT-B/16 (IC 95%: 98,32–98,64)"}, {"n": "p = 0,26", "o": "McNemar EfficientNet-B0 × ViT-B/16: empate"}, {"n": "75,4%", "o": "Fonte nunca vista (espinafre, N = 484) — queda de 23 pontos"}, {"n": "88,4%", "o": "Mesmo teste de espinafre depois de a fonte entrar no treino"}, {"n": "83,8% [58–96]", "o": "Campo, 13 fotos, ciclo 4 (acurácia balanceada)"}, {"n": "11 de 13 = 84,6% [57,8–95,7]", "o": "Mesmo campo, em proporção de acertos com Wilson"}, {"n": "31% e 15%", "o": "Erros interceptados pela abstenção: EfficientNet-B0 e ViT"}, {"n": "0,949 a 0,999", "o": "Confiança dos 9 erros de campo"}, {"n": "0,003 → 0,146", "o": "ECE na validação e em campo"}, {"n": "86,3% × 99,7%", "o": "Mesmo teste, mesma fonte: culturas fotografadas em lavoura (N = 4.530) × em estúdio (N = 10.061)"}, {"n": "81%", "o": "Fração dos erros do teste que está nas culturas de lavoura (295 de 363)"}, {"n": "23%", "o": "Fração do teste que são variantes de fotos de alface com outra variante no treino"}, {"n": "47,7%", "o": "Máximo do treino que deriva do PlantVillage (não diga 70%)"}, {"n": "1.231", "o": "Fotos originais de alface no treino; 108 doentes"}, {"n": "21 vezes", "o": "ViT-B/16 ÷ EfficientNet-B0 em parâmetros, nos modelos treinados (não diga 16)"}, {"n": "3.972", "o": "Alfaces saudáveis que estavam rotuladas como doentes"}, {"n": "1,7%", "o": "Teste do ciclo 5 com quase-duplicata no treino (era 23%)"}, {"n": "86,3 → 88,8%", "o": "Lavoura, EfficientNet-B0, ciclo 4 → ciclo 5 (especificidade 76,6 → 83,4; sensibilidade 96,0 → 94,2)"}, {"n": "+7 a +12 / −2 a −5", "o": "Ciclo 5 nas três CNNs, na lavoura: pontos de especificidade ganhos / de sensibilidade perdidos"}, {"n": "85,8–90,1%", "o": "Lote de espinafre que nenhum modelo do ciclo 5 viu"}, {"n": "176 (15 doentes)", "o": "Fotos de alface no teste honesto do ciclo 5; os modelos acertam de 96,7% a 100%"}, {"n": "13 + 10", "o": "Fotos de campo: 13 históricas e 10 com fundo real (27/10, todas sadias; 10 de 10 nas quatro versões, Wilson 72–100%)"}], "perguntas": [{"k": 1, "c": "O resultado", "p": "Então o seu sistema não funciona?", "r": "Funciona nas fontes em que foi treinado e ainda não foi medido com amostra suficiente em campo. O que o trabalho mostra é que o número que a literatura costuma reportar não mede uso real — e mede o quanto falta. Na primeira horta com fundo real, não deu nenhum falso alarme em dez fotos de alface sadia; se reconhece doença na horta, ainda não sei."}, {"k": 2, "c": "O resultado", "p": "Qual é a contribuição, se o resultado é negativo?", "r": "Três: um caso documentado de vazamento com retratação; um protocolo de avaliação em três níveis; e a evidência, com teste pareado, de que a arquitetura não é o gargalo."}, {"k": 3, "c": "O resultado", "p": "Por que não treinou melhor?", "r": "Quatro arquiteturas chegam ao mesmo teto e um transformer vinte e uma vezes maior não melhora. Um estudo independente achou a mesma coisa (Tian et al., 2024). Mais treino no mesmo dado não resolve; o que falta é dado de outra distribuição."}, {"k": 4, "c": "O resultado", "p": "99,01% para 98,48%: meio ponto. O vazamento importava tanto assim?", "r": "A queda é pequena porque as duplicatas eram fáceis e as fotos restantes são da mesma distribuição. O vazamento importa por outro motivo: ele invalidava o número. E a medida de generalização veio de outro lado — 86% nas fotos de lavoura do próprio teste e 75% em uma fonte nunca vista."}, {"k": 5, "c": "O resultado", "p": "Como você sabe que não há mais vazamento?", "r": "Sei que não é zero, porque medi. Por semelhança, o vazamento residual é de 0,04%. Por proveniência, uma auditoria mostrou que uma fonte de alface é feita de rotações, recortes e filtros das mesmas fotos, e que 23% do teste têm outra variante no treino; o <i>hash</i> não liga uma rotação de ângulo livre à foto original. Refiz a comparação sem essa fonte: o teste dá 97,8% e a conclusão sobre as arquiteturas se mantém. A correção definitiva é agrupar por foto de origem — e foi o que fiz no ciclo 5: alface separada por fotografia original, uma foto por original no teste. A auditoria desse split deu 1,7% do teste com alguma imagem parecida no treino, contra 23% antes, e boa parte desses pares são colisões entre culturas diferentes, não a mesma foto. Nas 176 fotos de alface honestas, os quatro modelos acertam de 96,7% a 100%; com só 15 doentes, o intervalo é largo, e por isso a resposta sobre a alface vem do campo. <b>5b. &quot;E o ciclo 5 ficou melhor?&quot;</b> (14/10/2026; detalhe em CORRECOES §15.10) Melhor onde o erro estava, com um custo. Nas culturas fotografadas em lavoura, que tinham 81% dos erros, as CNNs ganham de 2 a 3,5 pontos de acurácia balanceada e de 7 a 12 de especificidade: o atalho &quot;foto de lavoura = doente&quot; diminuiu. Em troca, a sensibilidade cai de 2 a 5 pontos e, contado imagem a imagem, o ciclo 4 acerta mais, porque as doentes são maioria. Não escondo isso: digo qual erro cada modelo comete e deixo claro que a escolha depende do custo de cada erro na horta. O ViT quase não muda. E a fonte de espinafre que nenhum modelo viu dá 86–90%, cerca de 10 pontos abaixo das fontes vistas — é o tamanho do problema de domínio dentro da mesma cultura."}, {"k": 6, "c": "O método", "p": "Por que classificação binária?", "r": "É triagem: dizer ao produtor se precisa olhar com atenção. E os datasets públicos não têm as mesmas doenças para as cinco culturas, o que inviabilizava classes consistentes. Multiclasse está nos trabalhos futuros."}, {"k": 7, "c": "O método", "p": "Por que usar PlantVillage se ele não tem as suas culturas?", "r": "Porque não existe dataset público de doenças para rúcula, acelga ou couve. Usei como <i>proxy</i> visual e declaro isso como limitação. O resultado do espinafre mostra o custo dessa escolha. E vale precisar: o PlantVillage e as culturas dele são no máximo 48% do treino; há 30% de alface e 18% de fotos de lavoura de outras culturas."}, {"k": 8, "c": "O método", "p": "Por que McNemar e não um teste t?", "r": "Os modelos são avaliados nas mesmas imagens, então as previsões são pareadas e binárias. O McNemar olha só as discordâncias. É o recomendado para esse caso (Dietterich, 1998)."}, {"k": 9, "c": "O método", "p": "Por que o intervalo de Wilson?", "r": "Com 13 observações, a aproximação normal dá intervalos errados. O de Wilson mantém a cobertura com amostra pequena."}, {"k": 10, "c": "O método", "p": "Por que 0,85 de limiar?", "r": "É o menor valor, a partir de 0,85, que garante 98% de acurácia seletiva na validação. O piso existe porque, em classificação binária, a confiança nunca é menor que 0,5, e sem piso o sistema nunca se abstinha. Reconheço que o limiar foi ajustado na validação e não protege fora dela."}, {"k": 11, "c": "O método", "p": "A comparação com o ViT é justa?", "r": "Mesmos dados, mesma perda, mesmo critério de seleção e mesma calibração. Mudam os hiperparâmetros de otimização, que são os usuais para transformers. A ressalva está no texto: um treino por modelo."}, {"k": 12, "c": "O método", "p": "Uma semente só. E se o resultado for sorte?", "r": "É uma limitação real. O intervalo por <i>bootstrap</i> cobre a incerteza do teste, não a do treino. O que me dá alguma segurança é a consistência: os quatro ciclos de treino do EfficientNet-B0, em dados ligeiramente diferentes, ficaram entre 98,42% e 98,59%."}, {"k": 13, "c": "O método", "p": "Temperatura de 0,56. O que isso significa?", "r": "Que a calibração <b>aumenta</b> a confiança. O <i>label smoothing</i> deixa a rede pouco confiante no domínio de treino e a temperatura corrige para cima. Fora do domínio, isso pode estar inflando a confiança dos erros. É uma hipótese que identifiquei e que se testa recalculando o ECE de campo com temperatura igual a 1."}, {"k": 14, "c": "O método", "p": "Como garante que os rótulos estão certos?", "r": "Não garanto por completo. Os rótulos vêm das fontes públicas, e já encontrei quase quatro mil trocados por um defeito meu de rotulagem automática. Hoje há um mapa auditável de pasta para rótulo. Validação por fitopatologista está nos trabalhos futuros."}, {"k": 15, "c": "O campo", "p": "Por que só 13 fotos?", "r": "Era a amostra do TCC-I, e ela cumpriu um papel: revelou o defeito de rotulagem. Mas não tem poder para comparar modelos, e o trabalho demonstra isso com o intervalo de Wilson. Em 27/10 entraram 10 com fundo real; a horta tinha poucos pés, todos sadios. <b>15b. &quot;Suas fotos de horta são todas saudáveis. Isso prova o quê?&quot;</b> Prova uma coisa só: que o fundo real — solo, mato, vários pés — não faz o modelo acusar doença onde não há. É especificidade, com intervalo de 72% a 100%. Não prova que ele reconhece doença na horta; por isso não calculo acurácia balanceada de campo com essas fotos, e o artigo diz isso."}, {"k": 16, "c": "O campo", "p": "Por que a acurácia de campo caiu quando você corrigiu os bugs?", "r": "Não caiu de forma detectável. Os intervalos dos ciclos se sobrepõem entre 64,6% e 90,3%. Com 13 fotos, uma foto a mais ou a menos muda o ponto estimado em quase oito pontos."}, {"k": 17, "c": "O campo", "p": "A culpa é do fundo?", "r": "É uma das hipóteses, e eu não a testei diretamente. O que medi: o espinafre tem fundo limpo e mesmo assim caiu 23 pontos, então o fundo não explica tudo; e as fotos de lavoura que já estão no treino dão 86%, então ter fundo real no treino ajuda mas não resolve. Há outras diferenças: a alface do treino é close-up da folha e quase toda saudável."}, {"k": 18, "c": "O campo", "p": "Se usar fotos de campo no treino, não está trapaceando?", "r": "Estaria, se fossem as mesmas da avaliação. Por isso a divisão é por horta: um conjunto que nunca treina e outro de adaptação. E a ordem é fixa: primeiro o modelo congelado é medido às cegas em tudo; só depois há adaptação."}, {"k": 19, "c": "A literatura", "p": "A literatura diz que transformers generalizam melhor. O seu não. Por quê?", "r": "A literatura não diz isso do ViT puro. A revisão de Shafay et al. (2025) aponta as arquiteturas híbridas, como o Swin, como mais robustas, e o ViT puro como mais sensível ao ambiente — que é o que eu vi: o meu ViT empata no teste e é o pior nas fotos de lavoura. Além disso, ele recebeu ajuste fino completo, que prejudica a transferência (Nguyen et al., 2026), e é um treino só. Não afirmo que transformers não ajudam; afirmo que, neste teste, este não ajudou, e o Swin fica como trabalho futuro."}, {"k": 20, "c": "A literatura", "p": "O que o seu trabalho tem de novo em relação a Workneh et al.?", "r": "O protocolo é parecido, e reconheço isso. A diferença é a cultura (hortaliças folhosas, com espécies-<i>proxy</i>), a comparação com um transformer, o registro completo dos erros do processo e, com a coleta, a avaliação em campo real."}, {"k": 21, "c": "A literatura", "p": "Como fez a revisão?", "r": "Web of Science, Coleção Principal, doze consultas registradas, triagem por título e resumo. Não é uma revisão sistemática."}, {"k": 22, "c": "Relevância e engenharia", "p": "Qual a relevância para a Engenharia de Software?", "r": "Os defeitos mais graves estavam nos dados e nenhum aparecia nas métricas. O trabalho é sobre garantir a qualidade de um sistema de aprendizado de máquina: auditoria, rastreabilidade, reprodutibilidade e comportamento seguro quando o modelo não sabe."}, {"k": 23, "c": "Relevância e engenharia", "p": "Um produtor poderia usar isso hoje?", "r": "Como triagem com supervisão, com a ressalva explícita de que a confiança mostrada não é confiável fora do domínio de treino. Como diagnóstico autônomo, não."}, {"k": 24, "c": "Relevância e engenharia", "p": "O que faria diferente se começasse hoje?", "r": "Três coisas: separaria uma fonte inteira para teste desde o primeiro dia; coletaria fotos de campo antes de treinar qualquer coisa; e registraria a procedência de cada imagem."}, {"k": 25, "c": "Relevância e engenharia", "p": "Qual foi o maior aprendizado?", "r": "Que uma métrica boa demais é uma hipótese, não um resultado."}, {"k": 26, "c": "Perguntas difíceis", "p": "Por que o MobileNetV2 piorou no ciclo 4?", "r": "Caiu de 98,18% para 97,89% no teste antigo, com significância. Os outros dois não mudaram. Não investiguei a causa; a hipótese é que, sendo o menor modelo, teve menos capacidade para acomodar as culturas novas. Não afeta a produção, que usa o EfficientNet-B0."}, {"k": 27, "c": "Perguntas difíceis", "p": "O ViT acertou 12 de 12 em campo. Não é o melhor?", "r": "Com intervalo de 75,8% a 100%, que se sobrepõe ao de todos os outros. Doze fotos não distinguem arquiteturas."}, {"k": 28, "c": "Perguntas difíceis", "p": "O ganho no espinafre prova que o modelo generaliza?", "r": "Não. Prova que, quando a fonte entra no treino, o teste dessa fonte sobe. É um ganho intra-fonte."}, {"k": 29, "c": "Perguntas difíceis", "p": "Por que não usou validação cruzada?", "r": "Com 175 mil imagens e 20 horas por ciclo de treino, o custo era proibitivo; e o problema principal não era a variância da partição, era a distribuição do teste. A fonte retida responde melhor a isso do que mais dobras da mesma fonte."}, {"k": 30, "c": "Perguntas difíceis", "p": "Esse 75,4% é de uma versão antiga. Qual é o número da versão atual?", "r": "A versão atual viu o espinafre no treino e faz 88,4%, mas esse já é um número intra-fonte. O 75,4% é o único com fonte genuinamente retida, e por isso é o que cito. Uma nova fonte retida para o ciclo 4 seria o conjunto de campo."}, {"k": 31, "c": "Perguntas difíceis", "p": "Os 98,48% então estão errados?", "r": "Não estão errados; estão incompletos. São a média de 99,7% em foto de estúdio, 97,7% nas variantes de alface e 86% em foto de lavoura. O número que descreve o uso real está mais perto do último."}, {"k": 32, "c": "Perguntas difíceis", "p": "Por que 81% na mandioca, se ela está no treino?", "r": "Porque é foto de lavoura: planta no solo, fundo natural, sintoma pequeno no quadro. A mandioca tem as duas classes, então a rede não pode decidir pela cultura. A especificidade ali é de 67%. Parte pode ser ruído de rótulo da própria fonte; não separei os dois efeitos."}, {"k": 33, "c": "Perguntas difíceis", "p": "Por que tantas culturas se o trabalho é sobre hortaliças folhosas?", "r": "Por falta de dados públicos das culturas-alvo. A consequência é que cultura e rótulo ficaram associados no treino: 87% da alface é saudável, e várias culturas têm um só rótulo. É um atalho que a rede pode ter aprendido, e é uma das correções do próximo ciclo."}, {"k": 34, "c": "Perguntas difíceis", "p": "Você mesmo encontrou esses erros. Não é um trabalho com muitos erros?", "r": "É um trabalho com muitos erros <i>encontrados e medidos</i>. A literatura mostra que eles são comuns e raramente reportados: vazamento em 294 artigos de 17 áreas (Kapoor; Narayanan, 2023). A diferença está em ter os artefatos para conferir e em reportar o que foi achado."}, {"k": 36, "c": "Perguntas difíceis", "p": "Você treinou cada modelo uma vez só. O empate entre EfficientNet-B0 e ViT vale?", "r": "Vale para os dois modelos treinados: o McNemar compara esses dois, nas mesmas 23.967 imagens. Não vale como afirmação sobre as arquiteturas em geral, e eu digo isso nas limitações. Coakley e Gundersen (2026) treinaram cada configuração 100 vezes e mostraram que o desempenho é uma distribuição. Repetir com várias sementes está nos trabalhos futuros."}, {"k": 37, "c": "Perguntas difíceis", "p": "Por que a calibração não resolveu em campo?", "r": "Porque a temperatura foi ajustada na validação, que tem a mesma distribuição do treino. Fora dela, a confiança deixa de acompanhar o acerto: o ECE foi de 0,003 para 0,146. Xiang, Shi e Zhu (2026) mediram o mesmo do PlantVillage para o PlantDoc: 32% de acerto com 80% de confiança média, mesmo depois do <i>temperature scaling</i>. A saída é recalibrar com fotos do domínio de uso, o que exige uma horta de adaptação separada da de avaliação."}, {"k": 38, "c": "Perguntas difíceis", "p": "Como foi feita a revisão da literatura?", "r": "A busca principal foi na Web of Science, em outubro de 2026, por tópico (doença de plantas e aprendizado profundo com generalização em campo, vazamento, calibração e hortaliças folhosas); li o texto completo dos sete trabalhos mais próximos. Em novembro, para as limitações, acrescentei quatro artigos de revistas indexadas (*Frontiers in Plant Science<i>, </i>Scientific Reports<i> e </i>Biosystems Engineering*), localizados em base aberta."}, {"k": 39, "c": "Perguntas difíceis", "p": "Por que o artigo cita o teste de McNemar sem a referência original?", "r": "Por espaço: o limite é de 10 páginas. Mantive Dietterich (1998), que é quem recomenda o McNemar para comparar classificadores avaliados no mesmo conjunto. O original é McNemar (1947)."}, {"k": 40, "c": "Perguntas difíceis", "p": "Por que o trabalho não tem objetivos específicos nem perguntas operacionais?", "r": "Porque no TCC-II o trabalho tem uma questão de pesquisa e um objetivo, os mesmos do resumo à conclusão; objetivo geral e específicos eram do TCC-I. O objetivo foi avaliar em que medida o sistema mantém desempenho confiável em fotografias de campo. O teste das mesmas fontes, a fonte nunca vista e o campo são as três situações em que medi isso: são o método, não três perguntas."}, {"k": 41, "c": "Perguntas difíceis", "p": "Afinal, a resposta à questão de pesquisa é sim ou não?", "r": "É parcial, e eu digo isso no artigo. Nas fontes de treino o sistema é confiável, e na horta sadia não deu nenhum falso alarme. A sensibilidade em campo não foi medida, porque a horta não tinha folhas doentes. Prefiro uma resposta parcial sustentada pelos dados a uma resposta completa que eles não sustentam."}], "limit": [{"t": "Campo pequeno", "d": "23 fotos, só de alface; o lote com fundo real não tem folhas doentes. Sensibilidade e domain gap em campo sem medida.", "f": "Os próprios dados"}, {"t": "Mesmas fontes públicas", "d": "Treino e teste da mesma origem; os conjuntos públicos estão longe do uso real; parte das culturas é só proxy visual.", "f": "Xu et al. (2024)"}, {"t": "Calibração fora do campo", "d": "Do laboratório para a lavoura, a confiança segue bem acima da acurácia. Aqui: ECE de 0,003 para 0,146.", "f": "Xiang; Shi; Zhu (2026)"}, {"t": "Tarefa binária", "d": "Não nomeia a doença; sintomas parecidos podem ter causas diferentes.", "f": "Barbedo (2016)"}, {"t": "Uma semente por modelo", "d": "O desempenho varia entre sementes; o empate EfficientNet-B0 × ViT pode não se repetir.", "f": "Coakley; Gundersen (2026)"}]};
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const mmss = (s) => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const app = document.getElementById('app');
const total = D.slides.reduce((a, s) => a + s.tempo, 0);
const fim = []; D.slides.reduce((a, s, i) => (fim[i] = a + s.tempo), 0);
const st = { run: false, t0: 0, acc: 0, cur: 0, cat: 'Todas', timer: null };
const elapsed = () => st.acc + (st.run ? (Date.now() - st.t0) / 1000 : 0);

function viewRoteiro() {
  app.append($(`<div><h1>Roteiro de falas</h1><p class="lead">Quinze slides, ${mmss(total)} em ritmo calmo. Ligue o relógio, fale em voz alta e avance quando terminar cada slide. O relógio mostra se você está adiantado ou atrasado em relação ao plano.</p></div>`));
  const c = $(`<section class="card" aria-label="Relógio do ensaio"><div class="clock">
    <div class="big num" id="ck">0:00</div>
    <div class="meta"><b id="ckS"></b><span id="ckD" class="num"></span></div>
    <div class="row"><button class="pri" id="bGo">Iniciar</button><button id="bNext">Próximo slide</button><button id="bZero">Zerar</button></div>
  </div><div class="track"><i id="bar"></i></div></section>`);
  app.append(c);
  D.slides.forEach((s, i) => {
    app.append($(`<article class="card slide" id="s${i}">
      <header><span class="n">Slide ${i + 1}</span><h2>${s.titulo}</h2><span class="t">${mmss(s.tempo)} · termina em ${mmss(fim[i])}${s.pagina ? ' · artigo ' + s.pagina : ''}</span></header>
      <p class="msg">${s.mensagem}</p>
      <p class="fala">${s.fala}</p>
      ${s.transicao ? `<p class="trans">Transição: “${s.transicao}”</p>` : ''}
      ${s.se_perguntarem ? `<details><summary>Cola para perguntas</summary><p>${s.se_perguntarem}</p></details>` : ''}
    </article>`));
  });
  const go = c.querySelector('#bGo');
  go.onclick = () => { if (st.run) { st.acc = elapsed(); st.run = false; } else { st.t0 = Date.now(); st.run = true; } tick(); };
  c.querySelector('#bNext').onclick = () => { if (st.cur < D.slides.length - 1) { st.cur++; tick(); document.getElementById('s' + st.cur).scrollIntoView({ behavior: 'smooth', block: 'start' }); } };
  c.querySelector('#bZero').onclick = () => { st.run = false; st.acc = 0; st.cur = 0; tick(); };
  clearInterval(st.timer); st.timer = setInterval(() => st.run && tick(), 500); tick();
}
function tick() {
  const ck = document.getElementById('ck'); if (!ck) return;
  const e = elapsed(), s = D.slides[st.cur], alvo = fim[st.cur], dif = e - alvo;
  ck.textContent = mmss(e); ck.classList.toggle('late', e > 20 * 60);
  document.getElementById('ckS').textContent = `Slide ${st.cur + 1} de ${D.slides.length}: ${s.titulo}`;
  const d = document.getElementById('ckD');
  d.textContent = dif > 0 ? `Este slide deveria ter terminado há ${mmss(dif)}` : `Este slide termina em ${mmss(-dif)} (plano: ${mmss(alvo)})`;
  d.classList.toggle('late', dif > 0);
  document.getElementById('bar').style.width = Math.min(100, e / (20 * 60) * 100) + '%';
  document.getElementById('bGo').textContent = st.run ? 'Pausar' : (e > 0 ? 'Continuar' : 'Iniciar');
  document.querySelectorAll('.slide').forEach((el, i) => el.classList.toggle('now', i === st.cur));
}
function viewNumeros() {
  app.append($(`<div><h1>Cartão de números</h1><p class="lead">Os ${D.numeros.length} números para saber de cor. Toque em um cartão para ver o que ele significa; tente dizer antes de abrir.</p></div>`));
  const r = $(`<div class="row"><button id="bAll">Mostrar todos</button><button id="bHide">Esconder todos</button></div>`);
  const g = $(`<div class="grid"></div>`);
  D.numeros.forEach((n) => { const b = $(`<button class="flash hid" aria-expanded="false"><b class="v">${n.n}</b><span>${n.o}</span></button>`); b.onclick = () => { const h = b.classList.toggle('hid'); b.setAttribute('aria-expanded', String(!h)); }; g.append(b); });
  r.querySelector('#bAll').onclick = () => g.querySelectorAll('.flash').forEach((b) => { b.classList.remove('hid'); b.setAttribute('aria-expanded', 'true'); });
  r.querySelector('#bHide').onclick = () => g.querySelectorAll('.flash').forEach((b) => { b.classList.add('hid'); b.setAttribute('aria-expanded', 'false'); });
  app.append(r, g);
}
function viewPerguntas() {
  const cats = ['Todas', ...new Set(D.perguntas.map((p) => p.c))];
  app.append($(`<div><h1>Perguntas prováveis da banca</h1><p class="lead">${D.perguntas.length} perguntas com resposta de 30 a 45 segundos. Responda em voz alta antes de abrir. Se não souber: “Não medi isso. O que tenho de mais próximo é… e o experimento que responderia seria…”.</p></div>`));
  const bar = $(`<div class="row"><div class="chips" role="group" aria-label="Filtrar por assunto"></div><button class="pri" id="bSort">Sortear uma</button></div>`);
  const list = $(`<div style="display:flex;flex-direction:column;gap:12px"></div>`);
  const draw = (only) => { list.innerHTML = ''; D.perguntas.filter((p) => only ? p === only : (st.cat === 'Todas' || p.c === st.cat)).forEach((p) => list.append($(`<article class="card q"><span class="tag">${p.c} · nº ${p.k}</span><h2>“${p.p}”</h2><details${only ? '' : ''}><summary>Ver resposta</summary><p class="a">${p.r}</p></details></article>`))); };
  cats.forEach((c) => { const b = $(`<button aria-pressed="${c === st.cat}">${c}</button>`); b.onclick = () => { st.cat = c; bar.querySelectorAll('.chips button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); draw(); }; bar.querySelector('.chips').append(b); });
  bar.querySelector('#bSort').onclick = () => draw(D.perguntas[Math.floor(Math.random() * D.perguntas.length)]);
  app.append(bar, list); draw();
}
function viewLimites() {
  app.append($(`<div><h1>Limitações do estudo</h1><p class="lead">As cinco que estão no artigo e no slide 13, na ordem em que você fala. Diga antes que perguntem, sem pedir desculpas.</p></div>`));
  app.append($(`<section class="card"><div class="scroll"><table><thead><tr><th>#</th><th>Limitação</th><th>O que dizer</th><th>Fonte</th></tr></thead><tbody>${D.limit.map((l, i) => `<tr><td class="num">${i + 1}</td><td><b>${l.t}</b></td><td>${l.d}</td><td>${l.f}</td></tr>`).join('')}</tbody></table></div></section>`));
  app.append($(`<section class="card"><h2>A frase que resume a postura</h2><p class="fala">Este trabalho não entrega um modelo pronto para o campo. Entrega a medida honesta de quanto falta, a explicação de por que falta e o caminho para chegar lá.</p></section>`));
  app.append($(`<section class="card"><h2>Regras de palco</h2><p>Não leia o slide: conte a história do número grande. Diga os intervalos em voz alta (“84,6%, com intervalo de 58 a 96”). Não diga “laboratório” para o 98,48%: diga “intra-fonte”. Pare dois segundos depois do slide 6 e do slide 9.</p></section>`));
}
const views = { roteiro: viewRoteiro, numeros: viewNumeros, perguntas: viewPerguntas, limites: viewLimites };
function route() {
  const v = views[location.hash.slice(1)] ? location.hash.slice(1) : 'roteiro';
  app.innerHTML = ''; views[v]();
  document.querySelectorAll('#nav a').forEach((a) => a.getAttribute('href') === '#' + v ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route); route();
</script>
